<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340">
  <defs>
    <style>
      @font-face {
        font-family: 'Space Mono';
        src: url('data:font/woff;charset=utf-8;base64,') format('woff');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Instrument Serif Italic';
        src: url('data:font/woff;charset=utf-8;base64,') format('woff');
        font-weight: 400;
        font-style: italic;
      }
      
        @keyframes tileEntrance {
          0% { opacity: 0; transform: translateY(16px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        .tile-content { opacity: 0; animation: tileEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards; }
        
      @media (prefers-reduced-motion: reduce) {
        *, .tile-content {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="380" height="340" rx="22" fill="#265bf6"/>

  <g class="tile-content">
    <!-- Top Tracker Category & Arrow -->
    <text x="36" y="52" font-family="'Space Mono', monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#ffffff">BUILD</text>
    <text x="344" y="52" font-family="'Space Mono', monospace" font-size="20" font-weight="400" fill="#ffffff" text-anchor="end">&#x2192;</text>

    <!-- Center Serif Italic Headline -->
    <text x="36" y="160" font-family="'Instrument Serif Italic', 'Instrument Serif', serif" font-style="italic" font-size="46" fill="#ffffff">40+ repos</text>

    <!-- Bottom Description -->
    <text x="36" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#ffffff" opacity="0.94">TruckTalk AI, Code Sentinel,</text>
<text x="36" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#ffffff" opacity="0.94">SoulSpace, and production MERN</text>
<text x="36" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#ffffff" opacity="0.94">architectures.</text>

  </g>
</svg>