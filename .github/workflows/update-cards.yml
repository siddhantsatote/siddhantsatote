name: Update Profile Animated Cards

on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC
  workflow_dispatch:     # Manual run via GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'source-photo.png'
      - 'data/**'

permissions:
  contents: write

jobs:
  build-and-update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch Contributions & Render Animated Cards
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python scripts/generate_cards.py --fetch

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/contributions.json cards/*.svg
          if git diff --staged --quiet; then
            echo "No card or contribution updates to commit."
          else
            git commit -m "chore: auto-update contribution data and animated profile cards [skip ci]"
            git push
          fi

