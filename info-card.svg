<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 650" width="610" height="650">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Gradient Border -->
  <rect x="1" y="1" width="608" height="648" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  
  <!-- Terminal Header Bar -->
  <path d="M 1 12 A 12 12 0 0 1 13 1 L 597 1 A 12 12 0 0 1 609 12 L 609 38 L 1 38 Z" fill="url(#headerGrad)"/>
  <line x1="1" y1="38" x2="609" y2="38" stroke="#30363d" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#27c93f"/>
  <text x="305" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">siddhantsatote@github: ~$ neofetch --release</text>

  <!-- Content Rows with Staggered Entrance Animations -->
